<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* ===== Login Page Styling ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('{{ url_for('static', filename='image/bg.jpg') }}') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Overlay blur */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      z-index: 0;
    }

    .login-box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 40px 50px;
      width: 350px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      color: #fff;
    }

    .login-box h2 {
      color: gold;
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 26px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .login-box input:focus {
      background: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px gold;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: gold;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      color: black;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-box button:hover {
      background: #ffdd00;
      box-shadow: 0 0 15px gold, 0 0 25px #ffea00;
      transform: scale(1.05);
    }

    .login-box a {
      display: inline-block;
      margin-top: 15px;
      color: #fff;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .login-box a:hover {
      color: gold;
      text-decoration: underline;
    }

    .logo {
      font-size: 45px;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h2><span class="logo">🔐</span> Hotel Login</h2>

    <form action="{{ url_for('login') }}" method="POST">
      <input type="email" name="email" placeholder="Enter your email" required>
      <input type="password" name="password" placeholder="Enter your password" required>
      <button type="submit">Login</button>
    </form>

    <a href="{{ url_for('register') }}">Don’t have an account? Register here</a>
  </div>
</body>
</html>
