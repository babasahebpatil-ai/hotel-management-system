<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register - Hotel Shakti</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* ===== Improved Register Page Styling ===== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('{{ url_for('static', filename='image/bg.jpg') }}') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55); /* darker overlay */
      backdrop-filter: blur(6px);
      z-index: 0;
    }

    .register-box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 40px 50px;
      width: 370px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
      color: #fff;
    }

    .register-box h2 {
      font-weight: 600;
      margin-bottom: 20px;
      font-size: 26px;
      color: gold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 10px gold;
    }

    input::placeholder {
      color: #ddd;
    }

    .btn {
      background: gold;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #ffde3d;
      box-shadow: 0 0 15px gold;
      transform: scale(1.05);
    }

    a {
      display: inline-block;
      margin-top: 15px;
      color: #fff;
      text-decoration: none;
    }

    a:hover {
      color: gold;
      text-decoration: underline;
    }

  </style>
</head>

<body>
  <div class="register-box">
    <h2>📝 Register Account</h2>

    <form method="POST" action="{{ url_for('register') }}">
      <input name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button class="btn" type="submit">Register</button>
    </form>

    <a href="{{ url_for('login') }}">Already have an account? Login</a>
  </div>
</body>
</html>
